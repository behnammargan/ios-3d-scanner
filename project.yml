name: Scanner3D
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only

targets:
  Scanner3D:
    type: application
    platform: iOS
    sources:
      - path: Scanner3D
    settings:
      base:
        PRODUCT_NAME: "Scanner3D"
        PRODUCT_BUNDLE_IDENTIFIER: "com.local.Scanner3D"
        INFOPLIST_FILE: "Scanner3D/Info.plist"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
